# Запуск из video-conference-app-backend/deploy/ (рядом на диске — клоны frontend и signaling):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Перед первым запуском: скопируйте .env.example в .env и заполните значения.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: video_conference
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GIN_MODE: release
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: video_conference
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN_SUFFIXES: ${ALLOWED_ORIGIN_SUFFIXES}
    volumes:
      - api_uploads:/app/uploads

  signaling:
    build:
      context: ../../video-conference-app-signaling
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4443"
      MEDIASOUP_ANNOUNCED_IP: ${VPS_PUBLIC_IP}
      MEDIASOUP_RTC_MIN_PORT: "40000"
      MEDIASOUP_RTC_MAX_PORT: "41000"
    expose:
      - "4443/tcp"
    ports:
      - "40000-41000:40000-41000/udp"

  web:
    build:
      context: ../../video-conference-app-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_SIGNALING_URL: ${PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - api
      - signaling

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - signaling
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  api_uploads:
