map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream next_app {
    server web:3000;
}

upstream api_backend {
    server api:8080;
}

upstream signaling_ws {
    server signaling:4443;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ^~ — чтобы не перехватил location / → прокси на Next (иначе ACME даст 404)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/proxy-locations.conf;
}
