version: '3.8'

services:
  app:
    build: .
    container_name: video-conference-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB=root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/video_conference_app?charset=utf8mb4&parseTime=True&loc=Local
      - JWT_SECRET=${JWT_SECRET}
      - VIDEOSDK_API_KEY=${VIDEOSDK_API_KEY}
      - VIDEOSDK_SECRET_KEY=${VIDEOSDK_SECRET_KEY}
      - VIDEOSDK_API_ENDPOINT=${VIDEOSDK_API_ENDPOINT}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: video-conference-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=video_conference_app
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
    driver: local